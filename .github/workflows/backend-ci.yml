name: Backend CI Pipeline

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
    branches: [main, 'feat/**']
  pull_request:
    paths:
      - 'backend/**'
    branches: [main]

jobs:
  build-and-test:
    name: Test & Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-backend-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-backend-

      - name: Install dependencies
        run: pnpm --prefix backend install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --prefix backend exec prisma generate

      - name: Run NestJS Build
        run: pnpm --prefix backend build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Container Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: webnovel-backend:test
