services:
  # ----------------------------------------------------
  # BACKEND SERVICE (NestJS App connected to Supabase Cloud)
  # ----------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webnovel-backend-local
    restart: always
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - JWT_SECRET=${JWT_SECRET:-dev_secret_jwt_key_novel_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_secret_refresh_jwt_key_novel_2026}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-1d}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-7d}
    networks:
      - webnovel-network

networks:
  webnovel-network:
    driver: bridge
