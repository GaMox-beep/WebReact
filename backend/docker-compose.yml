version: '3.8'

services:
  # ----------------------------------------------------
  # DATABASE SERVICE (PostgreSQL)
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: webnovel-postgres-local
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5433:5432' # Maps host port 5433 to container port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webnovel-network

  # ----------------------------------------------------
  # BACKEND SERVICE (NestJS App)
  # ----------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webnovel-backend-local
    restart: always
    ports:
      - '3000:3000' # Maps host port 3000 to container port 3000
    environment:
      # Note: We use "postgres" as the host since it matches the service name of the database container
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      - PORT=3000
    depends_on:
      - postgres
    networks:
      - webnovel-network

# Persistence for PostgreSQL data
volumes:
  postgres_data:

# Internal network for container communication
networks:
  webnovel-network:
    driver: bridge
